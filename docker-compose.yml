# Base pensada para producción: el código va HORNEADO en la imagen (COPY . .
# en el Dockerfile), nada de bind-mount del código fuente. Para desarrollo
# local, súmale docker-compose.dev.yml (ver ese archivo y docs/docker.md):
#
#   Desarrollo:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Producción:  docker compose up -d

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Datos reales de candidatos/usuarios — deben sobrevivir a un rebuild
      # de la imagen, por eso van en volúmenes y no quedan solo "horneados".
      - ./storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-portal_core}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASS: ${DB_PASS:?Falta DB_PASS en tu .env}
      # Opcionales: sin ellas, el botón "Continuar con Google" simplemente
      # avisa que el login con Google no está configurado (ver AuthController.php).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Opcional: ruta (dentro del contenedor) al .json de una cuenta de
      # servicio de Google Cloud, para "Traer de Drive" en el explorador de
      # Administrativa y Financiera (ver app/Helpers/GoogleDrive.php). Sin
      # ella, ese botón avisa que no está configurado.
      GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:-}
      # Cifra el refresh_token del Drive personal de cada usuario antes de
      # guardarlo en la BD (ver app/Helpers/GoogleDrive.php). Sin ella,
      # "Conectar mi Google Drive" avisa que no está configurado en vez de
      # guardar el token sin cifrar.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Editor de Word/Excel/PowerPoint dentro del portal (opcional, ver
      # EditorController.php/OnlyOffice.php) — mismo secreto que el
      # contenedor "onlyoffice" de más abajo, para firmar/verificar la
      # comunicación entre ambos. OBLIGATORIO con Docker: si falta, compose
      # no arranca (un secreto vacío dejaría las URLs internas del editor
      # sin protección real). Sin Docker, sin este valor el editor queda
      # apagado (503 en /editor/archivo y /editor/callback).
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?falta el secreto}
      ONLYOFFICE_PORT: ${ONLYOFFICE_PORT:-8082}
      # Tablero de Trello en "Todos los módulos" → Trello (opcional, ver
      # app/Helpers/Trello.php). Sin ellas, ese módulo avisa que no está
      # configurado.
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portal_core}
      MYSQL_USER: ${DB_USER:-portal_user}
      MYSQL_PASSWORD: ${DB_PASS:?Falta DB_PASS en tu .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Falta DB_ROOT_PASS en tu .env}
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez que el volumen db_data está vacío
      # (comportamiento estándar de la imagen mysql) — recrean el esquema
      # completo migración por migración, en orden (000...040).
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    restart: unless-stopped

  # Editor de Word/Excel/PowerPoint dentro del portal (opcional, ver
  # .env.example) — OnlyOffice Docs, autoalojado. "app" le pide el archivo
  # y recibe los cambios guardados por acá mismo (red interna de Docker,
  # nombre de servicio "app"); el navegador del usuario solo carga su
  # interfaz de edición vía ONLYOFFICE_PORT (ver EditorController.php).
  # JWT_SECRET firma esa comunicación para que nadie más pueda hablarle al
  # contenedor ni hacerse pasar por él.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?falta el secreto}
      JWT_HEADER: Authorization
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    restart: unless-stopped

volumes:
  db_data:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
