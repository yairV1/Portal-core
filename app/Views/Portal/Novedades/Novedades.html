<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Novedades — Portal CORE (HTML de prueba)</title>
<style>
  :root{
    --color-bg:#ffffff; --color-surface:#f5f3f4; --color-text:#201e1d;
    --color-divider: rgba(32,30,29,.3);
    --color-accent:#9e1f63; --color-accent-200:#f3d6e6; --color-accent-800:#4d0c2c;
    --color-accent-700:#6b123f; --color-accent-2:#f15a29;
    --font-heading: system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-heading);background:var(--color-bg);color:var(--color-text)}
  h1,h2,h3,h4{font-weight:800;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid var(--color-divider);background:transparent;padding:6px 10px;color:var(--color-text)}
  .btn-icon{width:36px;height:36px;padding:0}
  .btn:hover{background:rgba(0,0,0,.05)}

  .app{display:flex;flex-direction:column;min-height:100vh}
  .app-body{display:flex;flex:1;align-items:stretch}

  header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;height:68px;padding:0 24px;background:var(--color-bg);border-bottom:2px solid var(--color-divider)}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;padding-right:20px;border-right:2px solid var(--color-divider);height:100%}
  .brand-logo{width:32px;height:32px;background:var(--color-accent);flex:0 0 auto}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:-0.02em}
  .brand-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.55}
  .search-wrap{position:relative;flex:1;max-width:640px}
  .search-box{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;background:var(--color-surface);border:1px solid var(--color-divider)}
  .search-box input{flex:1;height:40px;border:0;background:transparent;color:var(--color-text);font-size:14px;outline:none}
  .kbd{font-size:10px;letter-spacing:.06em;border:1px solid var(--color-divider);padding:3px 6px;opacity:.55}
  .right-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .profile{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--color-divider);cursor:pointer}
  .avatar{width:30px;height:30px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .profile-name{font-size:12px;font-weight:800}
  .profile-role{font-size:10px;opacity:.6}
  .bell-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--color-accent-2);border-radius:50%}

  aside{width:278px;flex:0 0 auto;border-right:2px solid var(--color-divider);position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;display:flex;flex-direction:column;background:var(--color-bg);transition:width .15s ease}
  aside.collapsed{width:0;overflow:hidden;border-right:0}
  .nav-section{border-bottom:2px solid var(--color-divider)}
  .nav-section-inner{padding:18px 0 10px}
  .nav-section-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.45;padding:0 20px 8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;font-weight:800;font-size:13px;color:var(--color-text)}
  .nav-item:hover{background:var(--color-surface)}
  .nav-item.active{border-left-color:var(--color-accent);background:var(--color-surface);color:var(--color-accent-700)}
  .nav-item .ic{opacity:.85;width:18px;text-align:center}
  .nav-item .label{flex:1}
  .nav-footer{margin-top:auto;padding:18px 20px;font-size:11px;opacity:.5;line-height:1.5}

  main{flex:1;min-width:0;padding:36px 40px 64px;max-width:1560px}
  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:10px;border-bottom:2px solid var(--color-divider)}
  .table td{padding:10px;border-bottom:1px solid var(--color-divider)}
  .table tbody tr{cursor:pointer}
  .table tbody tr:hover{background:var(--color-surface)}
  .tag{display:inline-flex;font-size:10px;padding:3px 8px;background:var(--color-surface)}

  /* ── módulo genérico de dirección ── */
  .modulo-head{border-bottom:2px solid var(--color-divider);padding-bottom:24px;margin-bottom:30px}
  .modulo-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--color-accent-700);padding-bottom:10px}
  .modulo-titulo{font-size:40px;margin:0 0 10px}
  .modulo-desc{opacity:.65;max-width:700px;margin:0}

  .modulo-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--color-divider);margin-bottom:36px}
  .modulo-kpi{padding:20px 22px;border-right:1px solid var(--color-divider)}
  .modulo-kpi .label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.55}
  .modulo-kpi .valor{font-weight:800;font-size:30px;letter-spacing:-.03em;padding-top:8px}

  .modulo-grid{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:start}
  .section-head{border-bottom:2px solid var(--color-divider);padding-bottom:10px;margin-bottom:2px}

  .area-item{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--color-divider);cursor:pointer}
  .area-item:hover{background:var(--color-surface)}
  .area-item .ic{color:var(--color-accent);padding-top:2px}
  .area-item .label{display:block;font-weight:800;font-size:16px}
  .area-item .meta{display:block;font-size:12.5px;opacity:.6;padding-top:4px}
  .area-item .arrow{opacity:.4}

  .side-box{border:1px solid var(--color-divider);padding:22px}
  .side-box-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.5;padding-bottom:12px}
  .responsable{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--color-divider)}
  .responsable .ini{width:32px;height:32px;flex:0 0 auto;background:var(--color-accent-200);color:var(--color-accent-800);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .responsable .nombre{display:block;font-weight:800;font-size:13px}
  .responsable .cargo{display:block;font-size:11px;opacity:.6}
  .software-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--color-divider);font-size:12.5px}
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="btn btn-icon" id="btnToggleNav" title="Menú">☰</button>
    <div class="brand" onclick="location.reload()">
      <div class="brand-logo"></div>
      <span>
        <span class="brand-name" style="display:block">PORTAL CORE</span>
        <span class="brand-sub" style="display:block">Coreducación</span>
      </span>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Buscar documentos, personas, procesos, formatos, indicadores…">
        <span class="kbd">CTRL K</span>
      </div>
    </div>
    <div class="right-actions">
      <button class="btn btn-icon" id="btnTheme" title="Modo claro / oscuro">🌙</button>
      <button class="btn btn-icon" title="Notificaciones" style="position:relative">🔔<span class="bell-dot"></span></button>
      <div class="profile">
        <span class="avatar">MR</span>
        <span>
          <span class="profile-name" style="display:block">Martha Ruiz</span>
          <span class="profile-role" style="display:block">Rectoría</span>
        </span>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar">
      <div id="navSections"></div>
      <div class="nav-footer">Portal CORE v1.0<br>Sistema Nervioso Digital<br>COREDUCACIÓN · Honda, Tolima</div>
    </aside>

    <!-- ═══ CONTENIDO: GESTIÓN INSTITUCIONAL ═══ -->
    <main>
      <div class="modulo-head">
        <div class="modulo-kicker" id="moduloKicker"></div>
        <h1 class="modulo-titulo" id="moduloTitulo"></h1>
        <p class="modulo-desc" id="moduloDesc"></p>
      </div>

      <div class="modulo-kpis" id="moduloKpis"></div>

      <div class="modulo-grid">
        <div>
          <div class="section-head"><h4>Áreas del módulo</h4></div>
          <div id="moduloAreas"></div>

          <div class="section-head" style="margin-top:40px"><h4>Documentación destacada</h4></div>
          <table class="table">
            <thead><tr><th>Documento</th><th>Tipo</th><th>Ver.</th><th>Actualizado</th></tr></thead>
            <tbody id="moduloDocs"></tbody>
          </table>
        </div>

        <div style="display:flex;flex-direction:column;gap:28px">
          <div class="side-box">
            <div class="side-box-title">Responsables</div>
            <div id="moduloResponsables"></div>
          </div>
          <div class="side-box">
            <div class="side-box-title">Software relacionado</div>
            <div id="moduloSoftware"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  /* ═══ Datos de ejemplo — Novedades ═══ */
  const MODULO = {
    kicker: 'Comunicaciones Institucionales',
    titulo: 'Novedades',
    desc: 'Noticias, comunicados, circulares, eventos, reconocimientos y alertas institucionales.',
    kpis: [
      { label: 'Publicaciones mes', valor: '34' },
      { label: 'Circulares 2026', valor: '61' },
      { label: 'Eventos próximos', valor: '9' },
      { label: 'Lectura promedio', valor: '78%' }
    ],
    areas: [
      { label: 'Noticias', meta: 'Actualidad institucional' },
      { label: 'Comunicados y circulares', meta: 'Rectoría · Secretaría General' },
      { label: 'Eventos', meta: 'Agenda institucional' },
      { label: 'Reconocimientos', meta: 'Talento que suma' }
    ],
    docs: [
      { nombre: 'Circular 061 · Cierre académico 2026-II', tipo: 'Circular', version: 'V1.0', fecha: '29 jul 2026' },
      { nombre: 'Comunicado Rectoría · Acreditación', tipo: 'Comunicado', version: 'V1.0', fecha: '24 jul 2026' },
      { nombre: 'Boletín Institucional Julio', tipo: 'Boletín', version: 'V1.0', fecha: '18 jul 2026' }
    ],
    responsables: [
      { ini: 'VS', nombre: 'Valentina Suárez', cargo: 'Comunicaciones' }
    ],
    software: ['Correo institucional', 'Google Workspace']
  };

  document.getElementById('moduloKicker').textContent = MODULO.kicker;
  document.getElementById('moduloTitulo').textContent = MODULO.titulo;
  document.getElementById('moduloDesc').textContent = MODULO.desc;

  document.getElementById('moduloKpis').innerHTML = MODULO.kpis.map(k => `
    <div class="modulo-kpi"><div class="label">${k.label}</div><div class="valor">${k.valor}</div></div>`).join('');

  document.getElementById('moduloAreas').innerHTML = MODULO.areas.map(a => `
    <div class="area-item">
      <span class="ic">📁</span>
      <span style="flex:1">
        <span class="label">${a.label}</span>
        <span class="meta">${a.meta}</span>
      </span>
      <span class="arrow">→</span>
    </div>`).join('');

  document.getElementById('moduloDocs').innerHTML = MODULO.docs.map(d => `
    <tr>
      <td><strong>${d.nombre}</strong></td>
      <td style="opacity:.7">${d.tipo}</td>
      <td><span class="tag">${d.version}</span></td>
      <td style="opacity:.7">${d.fecha}</td>
    </tr>`).join('');

  document.getElementById('moduloResponsables').innerHTML = MODULO.responsables.map(r => `
    <div class="responsable">
      <span class="ini">${r.ini}</span>
      <span style="flex:1">
        <span class="nombre">${r.nombre}</span>
        <span class="cargo">${r.cargo}</span>
      </span>
    </div>`).join('');

  document.getElementById('moduloSoftware').innerHTML = MODULO.software.map(s => `
    <div class="software-item"><span style="opacity:.6">🔗</span>${s}</div>`).join('');

  /* ═══ PANEL LATERAL ═══ */
  const NAV = [
    { label: 'Principal', items: [
      { id: 'inicio', label: 'Inicio', icon: '🏠' },
      { id: 'tableros', label: 'Tableros Estratégicos', icon: '📊' },
      { id: 'sitemap', label: 'Mapa del portal', icon: '🗺️' }
    ]},
    { label: 'Direcciones', items: [
      { id: 'institucional', label: 'Gestión Institucional', icon: '🏛️' },
      { id: 'sgi', label: 'Sistema de Gestión Integral', icon: '🗂️' },
      { id: 'academica', label: 'Vicerrectoría Académica', icon: '🎓' },
      { id: 'financiera', label: 'Administrativa y Financiera', icon: '💰' },
      { id: 'talento', label: 'Talento Humano', icon: '👥' },
      { id: 'investigacion', label: 'Investigación e Innovación', icon: '✨' }
    ]},
    { label: 'Recursos', items: [
      { id: 'documental', label: 'Gestión Documental', icon: '📁' },
      { id: 'normatividad', label: 'Normatividad', icon: '⚖️' },
      { id: 'novedades', label: 'Novedades', icon: '📰' },
      { id: 'aplicaciones', label: 'Aplicaciones', icon: '🔲' }
    ]}
  ];
  document.getElementById('navSections').innerHTML = NAV.map(sec => `
    <div class="nav-section"><div class="nav-section-inner">
      <div class="nav-section-label">${sec.label}</div>
      ${sec.items.map(it => `
        <div class="nav-item ${it.id==='novedades'?'active':''}">
          <span class="ic">${it.icon}</span><span class="label">${it.label}</span>
        </div>`).join('')}
    </div></div>`).join('');

  document.getElementById('btnToggleNav').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });
  document.getElementById('btnTheme').addEventListener('click', function(){
    const dark = document.body.dataset.tema === 'oscuro';
    document.body.dataset.tema = dark ? 'claro' : 'oscuro';
    this.textContent = dark ? '🌙' : '☀️';
  });
</script>
</body>
</html>
