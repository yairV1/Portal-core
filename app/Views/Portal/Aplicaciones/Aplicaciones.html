<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Centro de aplicaciones — Portal CORE (HTML de prueba)</title>
<style>
  :root{
    --color-bg:#ffffff; --color-surface:#f5f3f4; --color-text:#201e1d;
    --color-divider: rgba(32,30,29,.3);
    --color-accent:#9e1f63; --color-accent-100:#fbeef5; --color-accent-700:#6b123f;
    --color-accent-2:#f15a29;
    --font-heading: system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-heading);background:var(--color-bg);color:var(--color-text)}
  h1,h2,h3,h4{font-weight:800;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid var(--color-divider);background:transparent;padding:6px 10px;color:var(--color-text)}
  .btn-icon{width:36px;height:36px;padding:0}
  .btn:hover{background:rgba(0,0,0,.05)}

  .app{display:flex;flex-direction:column;min-height:100vh}
  .app-body{display:flex;flex:1;align-items:stretch}

  header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;height:68px;padding:0 24px;background:var(--color-bg);border-bottom:2px solid var(--color-divider)}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;padding-right:20px;border-right:2px solid var(--color-divider);height:100%}
  .brand-logo{width:32px;height:32px;background:var(--color-accent);flex:0 0 auto}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:-0.02em}
  .brand-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.55}
  .search-wrap{position:relative;flex:1;max-width:640px}
  .search-box{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;background:var(--color-surface);border:1px solid var(--color-divider)}
  .search-box input{flex:1;height:40px;border:0;background:transparent;color:var(--color-text);font-size:14px;outline:none}
  .kbd{font-size:10px;letter-spacing:.06em;border:1px solid var(--color-divider);padding:3px 6px;opacity:.55}
  .right-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .profile{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--color-divider);cursor:pointer}
  .avatar{width:30px;height:30px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .profile-name{font-size:12px;font-weight:800}
  .profile-role{font-size:10px;opacity:.6}
  .bell-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--color-accent-2);border-radius:50%}

  aside{width:278px;flex:0 0 auto;border-right:2px solid var(--color-divider);position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;display:flex;flex-direction:column;background:var(--color-bg);transition:width .15s ease}
  aside.collapsed{width:0;overflow:hidden;border-right:0}
  .nav-section{border-bottom:2px solid var(--color-divider)}
  .nav-section-inner{padding:18px 0 10px}
  .nav-section-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.45;padding:0 20px 8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;font-weight:800;font-size:13px;color:var(--color-text)}
  .nav-item:hover{background:var(--color-surface)}
  .nav-item.active{border-left-color:var(--color-accent);background:var(--color-surface);color:var(--color-accent-700)}
  .nav-item .ic{opacity:.85;width:18px;text-align:center}
  .nav-item .label{flex:1}
  .nav-footer{margin-top:auto;padding:18px 20px;font-size:11px;opacity:.5;line-height:1.5}

  main{flex:1;min-width:0;padding:36px 40px 64px;max-width:1560px}

  /* ── centro de aplicaciones ── */
  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)}
  .app-card{background:var(--color-bg);padding:24px 22px;display:flex;flex-direction:column;gap:14px;min-height:176px;cursor:pointer}
  .app-card:hover{background:var(--color-surface)}
  .app-card-top{display:flex;align-items:center;justify-content:space-between}
  .app-icon{display:flex;width:42px;height:42px;align-items:center;justify-content:center;background:var(--color-accent-100);color:var(--color-accent-700);font-size:20px}
  .app-star{opacity:.35;cursor:pointer;font-size:16px}
  .app-star.fav{opacity:1;color:var(--color-accent)}
  .app-nombre{font-weight:800;font-size:16px;line-height:1.2}
  .app-categoria{font-size:12px;opacity:.6}
  .app-abrir{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);font-weight:800}
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="btn btn-icon" id="btnToggleNav" title="Menú">☰</button>
    <div class="brand" onclick="location.reload()">
      <div class="brand-logo"></div>
      <span>
        <span class="brand-name" style="display:block">PORTAL CORE</span>
        <span class="brand-sub" style="display:block">Coreducación</span>
      </span>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Buscar documentos, personas, procesos, formatos, indicadores…">
        <span class="kbd">CTRL K</span>
      </div>
    </div>
    <div class="right-actions">
      <button class="btn btn-icon" id="btnTheme" title="Modo claro / oscuro">🌙</button>
      <button class="btn btn-icon" title="Notificaciones" style="position:relative">🔔<span class="bell-dot"></span></button>
      <div class="profile">
        <span class="avatar">MR</span>
        <span>
          <span class="profile-name" style="display:block">Martha Ruiz</span>
          <span class="profile-role" style="display:block">Rectoría</span>
        </span>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar">
      <div id="navSections"></div>
      <div class="nav-footer">Portal CORE v1.0<br>Sistema Nervioso Digital<br>COREDUCACIÓN · Honda, Tolima</div>
    </aside>

    <!-- ═══ CONTENIDO: CENTRO DE APLICACIONES ═══ -->
    <main>
      <h1 style="font-size:40px;margin:0 0 8px">Centro de aplicaciones</h1>
      <p style="opacity:.65;max-width:640px;margin:0 0 30px">Acceso único a todos los sistemas institucionales. Inicio de sesión federado.</p>

      <div class="apps-grid" id="appsGrid"></div>
    </main>
  </div>
</div>

<script>
  /* ═══ Datos de ejemplo ═══ */
  const APPS = [
    { nombre: 'Correo institucional', categoria: 'Comunicación · Google Workspace', icon: '✉️' },
    { nombre: 'Google Workspace', categoria: 'Productividad', icon: '🌐' },
    { nombre: 'Microsoft 365', categoria: 'Productividad', icon: '🔲' },
    { nombre: 'ERP Institucional', categoria: 'Administrativo', icon: '📦' },
    { nombre: 'Software Contable', categoria: 'Financiero', icon: '💰' },
    { nombre: 'Software Académico', categoria: 'Académico', icon: '🎓' },
    { nombre: 'Campus Virtual', categoria: 'Académico', icon: '📘' },
    { nombre: 'Biblioteca digital', categoria: 'Académico', icon: '📚' },
    { nombre: 'Power BI', categoria: 'Analítica', icon: '📊' },
    { nombre: 'CRM Institucional', categoria: 'Gestión comercial', icon: '👥' },
    { nombre: 'Mesa de ayuda TI', categoria: 'Soporte', icon: '🛠️' },
    { nombre: 'Suite ISO', categoria: 'Sistema de Gestión Integral', icon: '🗂️' }
  ];

  const favoritos = new Set(); // ids marcados con estrella

  function renderApps(){
    document.getElementById('appsGrid').innerHTML = APPS.map((a,i) => `
      <div class="app-card" data-idx="${i}">
        <div class="app-card-top">
          <span class="app-icon">${a.icon}</span>
          <span class="app-star ${favoritos.has(i)?'fav':''}" data-star="${i}">★</span>
        </div>
        <span class="app-nombre">${a.nombre}</span>
        <span class="app-categoria">${a.categoria}</span>
        <span class="app-abrir">Abrir ↗</span>
      </div>`).join('');

    document.querySelectorAll('.app-star').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(el.dataset.star);
        favoritos.has(idx) ? favoritos.delete(idx) : favoritos.add(idx);
        renderApps();
      });
    });
    document.querySelectorAll('.app-card').forEach(el => {
      el.addEventListener('click', () => {
        alert('Abrir "' + APPS[el.dataset.idx].nombre + '" (login federado — se conecta con el sistema real)');
      });
    });
  }
  renderApps();

  /* ═══ PANEL LATERAL ═══ */
  const NAV = [
    { label: 'Principal', items: [
      { id: 'inicio', label: 'Inicio', icon: '🏠' },
      { id: 'tableros', label: 'Tableros Estratégicos', icon: '📊' },
      { id: 'sitemap', label: 'Mapa del portal', icon: '🗺️' }
    ]},
    { label: 'Direcciones', items: [
      { id: 'institucional', label: 'Gestión Institucional', icon: '🏛️' },
      { id: 'sgi', label: 'Sistema de Gestión Integral', icon: '🗂️' },
      { id: 'academica', label: 'Vicerrectoría Académica', icon: '🎓' },
      { id: 'financiera', label: 'Administrativa y Financiera', icon: '💰' },
      { id: 'talento', label: 'Talento Humano', icon: '👥' },
      { id: 'investigacion', label: 'Investigación e Innovación', icon: '✨' }
    ]},
    { label: 'Recursos', items: [
      { id: 'documental', label: 'Gestión Documental', icon: '📁' },
      { id: 'normatividad', label: 'Normatividad', icon: '⚖️' },
      { id: 'novedades', label: 'Novedades', icon: '📰' },
      { id: 'aplicaciones', label: 'Aplicaciones', icon: '🔲' }
    ]}
  ];
  document.getElementById('navSections').innerHTML = NAV.map(sec => `
    <div class="nav-section"><div class="nav-section-inner">
      <div class="nav-section-label">${sec.label}</div>
      ${sec.items.map(it => `
        <div class="nav-item ${it.id==='aplicaciones'?'active':''}">
          <span class="ic">${it.icon}</span><span class="label">${it.label}</span>
        </div>`).join('')}
    </div></div>`).join('');

  document.getElementById('btnToggleNav').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });
  document.getElementById('btnTheme').addEventListener('click', function(){
    const dark = document.body.dataset.tema === 'oscuro';
    document.body.dataset.tema = dark ? 'claro' : 'oscuro';
    this.textContent = dark ? '🌙' : '☀️';
  });
</script>
</body>
</html>
