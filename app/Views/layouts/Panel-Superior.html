<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel superior — Navbar</title>
<style>
  :root{
    --color-bg:#ffffff; --color-surface:#f5f3f4; --color-text:#201e1d;
    --color-divider: rgba(32,30,29,.3);
    --color-accent:#9e1f63; --color-accent-100:#fbeef5; --color-accent-700:#6b123f;
    --color-accent-2:#f15a29;
    --font-heading: system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-heading);background:#efeef0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid var(--color-divider);background:transparent;padding:6px 10px;color:var(--color-text)}
  .btn-icon{width:36px;height:36px;padding:0}
  .btn:hover{background:rgba(0,0,0,.05)}

  header{
    position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
    height:68px;padding:0 24px;background:var(--color-bg);
    border-bottom:2px solid var(--color-divider);
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;padding-right:20px;border-right:2px solid var(--color-divider);height:100%}
  .brand-logo{width:32px;height:32px;background:var(--color-accent);flex:0 0 auto}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:-0.02em}
  .brand-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.55}

  .search-wrap{position:relative;flex:1;max-width:640px}
  .search-box{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;background:var(--color-surface);border:1px solid var(--color-divider)}
  .search-box input{flex:1;height:40px;border:0;background:transparent;color:var(--color-text);font-size:14px;outline:none}
  .kbd{font-size:10px;letter-spacing:.06em;border:1px solid var(--color-divider);padding:3px 6px;opacity:.55}

  .search-dropdown{
    display:none;position:absolute;top:50px;left:0;right:0;background:var(--color-bg);
    border:1px solid var(--color-divider);box-shadow:0 12px 32px rgba(0,0,0,.15);
    max-height:60vh;overflow:auto;
  }
  .search-dropdown.open{display:block}
  .chips{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--color-divider);flex-wrap:wrap}
  .chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:4px 9px;cursor:pointer;border:1px solid var(--color-divider);background:transparent}
  .chip.active{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
  .result{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--color-divider);cursor:pointer}
  .result:hover{background:var(--color-surface)}
  .result-title{font-weight:800;font-size:14px}
  .result-route{font-size:12px;opacity:.6}
  .result-tag{margin-left:auto;font-size:10px;border:1px solid var(--color-accent);color:var(--color-accent);padding:2px 8px}

  .right-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .profile{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--color-divider);cursor:pointer}
  .avatar{width:30px;height:30px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .profile-name{font-size:12px;font-weight:800}
  .profile-role{font-size:10px;opacity:.6}
  .bell-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--color-accent-2);border-radius:50%}
</style>
</head>
<body>

<header>
  <button class="btn btn-icon" id="btnToggleNav" title="Menú">☰</button>

  <div class="brand" onclick="location.reload()">
    <div class="brand-logo"></div>
    <span>
      <span class="brand-name" style="display:block">PORTAL CORE</span>
      <span class="brand-sub" style="display:block">Coreducación</span>
    </span>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Buscar documentos, personas, procesos, formatos, indicadores…">
      <span class="kbd">CTRL K</span>
    </div>
    <div class="search-dropdown" id="searchDropdown">
      <div class="chips" id="chips"></div>
      <div id="results"></div>
      <div class="result" style="justify-content:center;font-weight:800;color:var(--color-accent-700)">Ver todos los resultados →</div>
    </div>
  </div>

  <div class="right-actions">
    <button class="btn btn-icon" id="btnTheme" title="Modo claro / oscuro">🌙</button>
    <button class="btn btn-icon" id="btnBell" title="Notificaciones" style="position:relative">
      🔔<span class="bell-dot"></span>
    </button>
    <div class="profile" id="btnProfile">
      <span class="avatar">MR</span>
      <span>
        <span class="profile-name" style="display:block">Martha Ruiz</span>
        <span class="profile-role" style="display:block">Rectoría</span>
      </span>
    </div>
  </div>
</header>

<script>
  // Datos de ejemplo — reemplaza con tus propios tipos/resultados
  const TIPOS = ['Todo', 'Documento', 'Persona', 'Proceso', 'Formato', 'Norma'];
  const RESULTADOS_EJEMPLO = [
    { titulo: 'Manual de Funciones', ruta: 'Talento Humano', tipo: 'Manual' },
    { titulo: 'Reglamento Estudiantil', ruta: 'Normatividad', tipo: 'Reglamento' }
  ];

  const chipsEl = document.getElementById('chips');
  const resultsEl = document.getElementById('results');
  const dropdown = document.getElementById('searchDropdown');
  const input = document.getElementById('searchInput');

  function renderChips(){
    chipsEl.innerHTML = TIPOS.map((t,i) =>
      `<button class="chip ${i===0?'active':''}" data-t="${t}">${t}</button>`
    ).join('');
  }
  function renderResults(){
    resultsEl.innerHTML = RESULTADOS_EJEMPLO.map(r => `
      <div class="result">
        <span class="result-title" style="flex:1">${r.titulo}<br><span class="result-route">${r.ruta}</span></span>
        <span class="result-tag">${r.tipo}</span>
      </div>`).join('');
  }
  renderChips(); renderResults();

  chipsEl.addEventListener('click', e => {
    if (!e.target.classList.contains('chip')) return;
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
  });

  input.addEventListener('focus', () => dropdown.classList.add('open'));
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) dropdown.classList.remove('open');
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') dropdown.classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); input.focus(); dropdown.classList.add('open');
    }
  });

  document.getElementById('btnTheme').addEventListener('click', function(){
    const dark = document.body.dataset.tema === 'oscuro';
    document.body.dataset.tema = dark ? 'claro' : 'oscuro';
    this.textContent = dark ? '🌙' : '☀️';
  });

  document.getElementById('btnToggleNav').addEventListener('click', () => {
    // Conecta esto con el panel lateral: dispatch de un evento personalizado
    document.dispatchEvent(new CustomEvent('toggle-nav'));
  });

  document.getElementById('btnProfile').addEventListener('click', () => {
    alert('Abrir panel de perfil (conecta aquí tu modal / drawer de detalle)');
  });
  document.getElementById('btnBell').addEventListener('click', () => {
    alert('Abrir panel de notificaciones');
  });
</script>
</body>
</html>
